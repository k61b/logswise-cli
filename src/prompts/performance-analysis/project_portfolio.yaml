name: "Project Portfolio Templates"
description: "Templates for displaying active projects with context and priorities"
version: "1.0"
category: "performance-analysis"
type: "context_templates"

templates:
  active_project:
    name: "Active Project Display"
    description: "Template for showing individual project details"
    template: |
      🚀 PROJECT {{project_index}}: {{project_name}} [{{project_status}}]
      ├─ Tech Stack: {{tech_stack}}
      ├─ Team Context: {{team_context}} ({{team_size}} people)
      ├─ Key Challenges: {{key_challenges}}
      └─ Strategic Focus: {{strategic_focus}}

  project_portfolio:
    name: "Complete Project Portfolio"
    description: "Template for displaying all active projects"
    template: |
      🎯 ACTIVE PROJECT PORTFOLIO:
      Current Focus: {{current_focus}}
      Strategic Priorities: {{strategic_priorities}}
      
      {{active_projects_list}}

  project_summary:
    name: "Project Summary"
    description: "Brief overview of projects for context"
    template: |
      📊 PROJECT CONTEXT:
      - Total Active Projects: {{total_projects}}
      - Current Priority: {{current_priority}}
      - Key Technologies: {{key_technologies}}
      - Main Challenges: {{main_challenges}}

variables:
  - name: "project_index"
    description: "Project number/index"
    type: "integer"
    required: true
  - name: "project_name"
    description: "Name of the project"
    type: "string"
    required: true
  - name: "project_status"
    description: "Current project status"
    type: "string"
    required: true
  - name: "tech_stack"
    description: "Technologies used in the project"
    type: "string"
    required: true
  - name: "team_context"
    description: "Team composition and context"
    type: "string"
    required: false
  - name: "team_size"
    description: "Number of team members"
    type: "integer"
    required: false
  - name: "key_challenges"
    description: "Main challenges in the project"
    type: "string"
    required: true
  - name: "strategic_focus"
    description: "Strategic objectives for the project"
    type: "string"
    required: true
  - name: "current_focus"
    description: "Current focus across all projects"
    type: "string"
    required: false
  - name: "strategic_priorities"
    description: "Overall strategic priorities"
    type: "string"
    required: false
  - name: "active_projects_list"
    description: "List of all active projects"
    type: "array"
    required: false
  - name: "total_projects"
    description: "Total number of active projects"
    type: "integer"
    required: false
  - name: "current_priority"
    description: "Current highest priority project"
    type: "string"
    required: false
  - name: "key_technologies"
    description: "Key technologies across all projects"
    type: "string"
    required: false
  - name: "main_challenges"
    description: "Main challenges across all projects"
    type: "string"
    required: false