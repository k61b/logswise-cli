name: "Goal Development Templates"
description: "Templates for tracking and developing professional goals"
version: "1.0"
category: "performance-analysis"
type: "context_templates"

templates:
  goal_tracking:
    name: "Goal Tracking Display"
    description: "Template for showing individual goal progress"
    template: |
      🎯 GOAL: {{goal_title}}
      ├─ Timeline: {{timeline}}
      ├─ Current Progress: {{progress_percentage}}% ({{progress_description}})
      ├─ Success Metrics: {{success_metrics}}
      ├─ Next Milestone: {{next_milestone}}
      └─ Blockers: {{current_blockers}}

  goal_portfolio:
    name: "Complete Goal Portfolio"
    description: "Template for displaying all active goals"
    template: |
      🎯 DEVELOPMENT GOALS PORTFOLIO:
      Overall Progress: {{overall_progress}}%
      Priority Focus: {{priority_focus}}
      
      {{active_goals_list}}

  goal_summary:
    name: "Goal Summary"
    description: "Brief overview of goals for context"
    template: |
      📊 GOAL CONTEXT:
      - Total Active Goals: {{total_goals}}
      - On Track: {{on_track_count}} | At Risk: {{at_risk_count}} | Blocked: {{blocked_count}}
      - Priority: {{current_priority_goal}}
      - Next Review: {{next_review_date}}

variables:
  - name: "goal_title"
    description: "Title of the goal"
    type: "string"
    required: true
  - name: "timeline"
    description: "Goal timeline/deadline"
    type: "string"
    required: true
  - name: "progress_percentage"
    description: "Current progress percentage"
    type: "integer"
    required: true
  - name: "progress_description"
    description: "Description of current progress"
    type: "string"
    required: true
  - name: "success_metrics"
    description: "How success will be measured"
    type: "string"
    required: true
  - name: "next_milestone"
    description: "Next milestone to achieve"
    type: "string"
    required: true
  - name: "current_blockers"
    description: "Current obstacles or blockers"
    type: "string"
    required: false
  - name: "overall_progress"
    description: "Overall progress across all goals"
    type: "integer"
    required: false
  - name: "priority_focus"
    description: "Current priority focus area"
    type: "string"
    required: false
  - name: "active_goals_list"
    description: "List of all active goals"
    type: "array"
    required: false
  - name: "total_goals"
    description: "Total number of active goals"
    type: "integer"
    required: false
  - name: "on_track_count"
    description: "Number of goals on track"
    type: "integer"
    required: false
  - name: "at_risk_count"
    description: "Number of goals at risk"
    type: "integer"
    required: false
  - name: "blocked_count"
    description: "Number of blocked goals"
    type: "integer"
    required: false
  - name: "current_priority_goal"
    description: "Current highest priority goal"
    type: "string"
    required: false
  - name: "next_review_date"
    description: "Date of next goal review"
    type: "string"
    required: false