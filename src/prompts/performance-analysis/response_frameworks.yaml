name: "Response Framework Templates"
description: "Intent-based response structuring for different professional scenarios"
version: "1.0"
category: "performance-analysis"
type: "framework_templates"

templates:
  meeting_preparation:
    name: "Meeting Preparation Framework"
    description: "Structure for meeting prep assistance"
    template: |
      📋 MEETING PREP FRAMEWORK:
      1. 🎯 AGENDA PREPARATION: Key topics to address
      2. 📊 PROGRESS SUMMARY: Quantified achievements
      3. 🚧 CHALLENGE ANALYSIS: Issues and proposed solutions
      4. 🎪 NEXT STEPS: Specific, measurable actions

  progress_reporting:
    name: "Progress Reporting Framework"
    description: "Structure for progress updates and reporting"
    template: |
      📈 PROGRESS REPORT FRAMEWORK:
      1. ✅ ACCOMPLISHMENTS: What was delivered
      2. 📊 METRICS: Quantifiable progress indicators
      3. 🔄 PROCESS IMPROVEMENTS: How efficiency was enhanced
      4. 🎯 UPCOMING MILESTONES: What's next with timelines

  problem_solving:
    name: "Problem-Solving Framework"
    description: "Structure for analytical problem solving"
    template: |
      🔧 PROBLEM-SOLVING FRAMEWORK:
      1. 🔍 ROOT CAUSE: Core issue identification
      2. 💡 SOLUTION OPTIONS: Alternative approaches
      3. ⚖️ TRADE-OFF ANALYSIS: Pros/cons of each option
      4. 🎯 RECOMMENDATION: Best path forward with rationale

  strategic_planning:
    name: "Strategic Planning Framework"
    description: "Structure for strategic thinking and planning"
    template: |
      🎯 STRATEGIC PLANNING FRAMEWORK:
      1. 🔍 SITUATIONAL ANALYSIS: Current state assessment
      2. 🎪 GOAL DEFINITION: Clear, measurable objectives
      3. 📋 ACTION PLANNING: Specific steps with timelines
      4. 📊 SUCCESS METRICS: How progress will be measured

  career_development:
    name: "Career Development Framework"
    description: "Structure for career growth guidance"
    template: |
      🚀 CAREER DEVELOPMENT FRAMEWORK:
      1. 📊 CURRENT ASSESSMENT: Skills and experience inventory
      2. 🎯 GROWTH AREAS: Development opportunities
      3. 📋 LEARNING PLAN: Specific skill building activities
      4. 🎪 MILESTONE TRACKING: Progress checkpoints

  general_advice:
    name: "General Advice Framework"
    description: "Default structure for general queries"
    template: |
      💡 GENERAL ADVICE FRAMEWORK:
      1. 🔍 CONTEXT ANALYSIS: Understanding the situation
      2. 💡 RECOMMENDATIONS: Specific actionable advice
      3. 📊 EXPECTED OUTCOMES: What success looks like
      4. 🎯 NEXT STEPS: Immediate actions to take

variables:
  - name: "query_intent"
    description: "Detected intent of the user query"
    type: "enum"
    values: ["meeting_preparation", "progress_reporting", "problem_solving", "strategic_planning", "career_development", "general_advice"]
    default: "general_advice"