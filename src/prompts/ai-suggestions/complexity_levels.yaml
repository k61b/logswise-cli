name: "Complexity Level Templates"
description: "Adaptive complexity calibration based on user expertise"
version: "1.0"
category: "ai-suggestions"
type: "style_templates"

templates:
  beginner:
    name: "Beginner Level"
    description: "Simple, step-by-step explanations"
    template: |
      COMPLEXITY LEVEL: Beginner
      - Explain concepts from first principles
      - Include background context and terminology
      - Break down complex tasks into small, manageable steps
      - Provide examples and analogies
      - Focus on foundational understanding

  intermediate:
    name: "Intermediate Level"
    description: "Balanced detail with some assumed knowledge"
    template: |
      COMPLEXITY LEVEL: Intermediate
      - Assume basic understanding of domain fundamentals
      - Focus on connecting concepts and patterns
      - Include best practices and common pitfalls
      - Provide multiple approaches when relevant
      - Balance detail with efficiency

  advanced:
    name: "Advanced Level"
    description: "High-level strategic thinking"
    template: |
      COMPLEXITY LEVEL: Advanced
      - Focus on strategic implications and trade-offs
      - Discuss architectural and design considerations
      - Reference industry standards and cutting-edge practices
      - Assume deep domain knowledge
      - Emphasize optimization and innovation

variables:
  - name: "user_complexity_level"
    description: "User's expertise level for complexity calibration"
    type: "enum"
    values: ["beginner", "intermediate", "advanced"]
    default: "intermediate"