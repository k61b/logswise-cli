name: "Learning Style Templates"
description: "Adaptive learning approach suggestions based on user preferences"
version: "1.0"
category: "ai-suggestions"
type: "style_templates"

templates:
  hands_on:
    name: "Practical Learning Approach"
    description: "Focus on practical exercises and implementation"
    template: |
      LEARNING APPROACH: Prioritize practical exercises, code examples, and actionable tasks. Include specific implementation steps.

  reading:
    name: "Documentation Learning Approach"
    description: "Focus on written resources and documentation"
    template: |
      LEARNING APPROACH: Suggest articles, documentation, and written resources. Include book recommendations when relevant.

  videos:
    name: "Visual Learning Approach"
    description: "Focus on video tutorials and visual content"
    template: |
      LEARNING APPROACH: Suggest video tutorials, online courses, and visual learning resources.

  peer_learning:
    name: "Collaborative Learning Approach"
    description: "Focus on team learning and community engagement"
    template: |
      LEARNING APPROACH: Emphasize collaborative learning, team discussions, mentoring opportunities, and community engagement.

  mixed:
    name: "Balanced Learning Approach"
    description: "Combination of multiple learning approaches"
    template: |
      LEARNING APPROACH: Combine practical exercises with documentation and peer learning. Adapt based on topic complexity.

variables:
  - name: "user_learning_style"
    description: "User's preferred learning style"
    type: "enum"
    values: ["hands_on", "reading", "videos", "peer_learning", "mixed"]
    default: "mixed"