name: "Communication Style Templates"
description: "Adaptive response formatting based on user communication preferences"
version: "1.0"
category: "ai-suggestions"
type: "style_templates"

templates:
  concise:
    name: "Executive Summary Style"
    description: "Brief, bullet-point focused responses"
    template: |
      FORMAT: Executive Summary Style
      - Use bullet points and numbered lists
      - Maximum 3 key recommendations
      - Include one-line success metrics for each
      - Total response: 150-250 words

  detailed:
    name: "Comprehensive Analysis Style"
    description: "In-depth responses with full context"
    template: |
      FORMAT: Comprehensive Analysis Style
      - Provide detailed reasoning and context
      - Include implementation steps and timeline
      - Address potential challenges and mitigation
      - Total response: 300-500 words

  casual:
    name: "Collaborative Advisor Style"
    description: "Friendly, encouraging communication"
    template: |
      FORMAT: Collaborative Advisor Style
      - Use friendly, encouraging language
      - Include motivational elements
      - Make suggestions feel approachable and doable
      - Use emojis strategically for clarity

  professional:
    name: "Enterprise Consultant Style"
    description: "Formal, business-focused communication"
    template: |
      FORMAT: Enterprise Consultant Style
      - Use formal, structured language
      - Focus on business impact and ROI
      - Include stakeholder considerations
      - Emphasize measurable outcomes

variables:
  - name: "user_communication_style"
    description: "User's preferred communication style"
    type: "enum"
    values: ["concise", "detailed", "casual", "professional"]
    default: "professional"