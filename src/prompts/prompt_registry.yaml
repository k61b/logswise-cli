name: "Prompt Registry"
description: "Central registry of all available prompts and templates"
version: "1.0"
metadata:
  created_at: "2024-01-01"
  last_updated: "2024-01-01"
  total_prompts: 11

categories:
  ai-suggestions:
    description: "Prompts for AI-powered suggestions and recommendations"
    prompts:
      - name: "system_prompt"
        file: "ai-suggestions/system_prompt.yaml"
        description: "Master system prompt for AI suggestion configuration"
        type: "system"
      - name: "communication_styles"
        file: "ai-suggestions/communication_styles.yaml"
        description: "Adaptive communication style templates"
        type: "style_templates"
      - name: "learning_styles"
        file: "ai-suggestions/learning_styles.yaml"
        description: "Learning approach templates"
        type: "style_templates"
      - name: "complexity_levels"
        file: "ai-suggestions/complexity_levels.yaml"
        description: "Complexity calibration templates"
        type: "style_templates"

  performance-analysis:
    description: "Prompts for performance analysis and professional development"
    prompts:
      - name: "system_prompt"
        file: "performance-analysis/system_prompt.yaml"
        description: "System prompt for personalized performance analysis"
        type: "system"
      - name: "response_frameworks"
        file: "performance-analysis/response_frameworks.yaml"
        description: "Intent-based response structuring templates"
        type: "framework_templates"
      - name: "project_portfolio"
        file: "performance-analysis/project_portfolio.yaml"
        description: "Templates for displaying active projects"
        type: "context_templates"
      - name: "goal_development"
        file: "performance-analysis/goal_development.yaml"
        description: "Templates for goal tracking and development"
        type: "context_templates"

  daily-logging:
    description: "Prompts for daily logging and note-taking functionality"
    prompts:
      - name: "chat_context"
        file: "daily-logging/chat_context.yaml"
        description: "Chat interaction context templates"
        type: "context_templates"
      - name: "note_suggestion"
        file: "daily-logging/note_suggestion.yaml"
        description: "Note-based suggestion templates"
        type: "context_templates"

  common:
    description: "Common templates shared across different prompt types"
    prompts:
      - name: "user_context"
        file: "common/user_context.yaml"
        description: "Common user context templates"
        type: "context_templates"

prompt_types:
  system:
    description: "Core system prompts that define AI behavior"
    characteristics: ["foundational", "comprehensive", "behavior-defining"]
  
  style_templates:
    description: "Templates that adapt AI response style"
    characteristics: ["adaptive", "format-focused", "preference-based"]
  
  framework_templates:
    description: "Structured response frameworks for specific scenarios"
    characteristics: ["structured", "scenario-specific", "format-driven"]
  
  context_templates:
    description: "Templates for providing context and background"
    characteristics: ["contextual", "informational", "background-providing"]

usage_patterns:
  ai_suggestions:
    primary_prompts: ["ai-suggestions/system_prompt"]
    supporting_prompts: ["ai-suggestions/communication_styles", "ai-suggestions/learning_styles", "ai-suggestions/complexity_levels"]
    context_prompts: ["common/user_context"]
    
  performance_analysis:
    primary_prompts: ["performance-analysis/system_prompt"]
    supporting_prompts: ["performance-analysis/response_frameworks", "performance-analysis/project_portfolio", "performance-analysis/goal_development"]
    context_prompts: ["common/user_context"]
    
  daily_logging:
    primary_prompts: ["daily-logging/chat_context", "daily-logging/note_suggestion"]
    supporting_prompts: []
    context_prompts: ["common/user_context"]