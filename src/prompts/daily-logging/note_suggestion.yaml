name: "Note Suggestion Templates"
description: "Templates for generating suggestions based on notes"
version: "1.0"
category: "daily-logging"
type: "context_templates"

templates:
  basic_suggestion:
    name: "Basic Note Suggestion"
    description: "Simple suggestion based on user query and notes"
    template: |
      {{user_info}}
      
      User wants suggestions for: {{query}}
      
      Relevant context from notes:
      {{notes_context}}
      
      Suggestions:

  enhanced_suggestion:
    name: "Enhanced Note Suggestion"
    description: "Rich suggestion with full context and formatting"
    template: |
      === USER CONTEXT ===
      {{user_info}}
      
      === QUERY ===
      {{query}}
      
      === RELEVANT EXPERIENCE ===
      {{notes_context}}
      
      === SUGGESTIONS ===
      Based on your documented experience and current query, here are specific recommendations:

  quick_suggestion:
    name: "Quick Note Suggestion"
    description: "Minimal context for quick suggestions"
    template: |
      Query: {{query}}
      Context: {{notes_context}}
      
      Quick suggestions:

variables:
  - name: "user_info"
    description: "User profile information"
    type: "string"
    required: true
  - name: "query"
    description: "User's query for suggestions"
    type: "string"
    required: true
  - name: "notes_context"
    description: "Relevant notes context"
    type: "string"
    required: false