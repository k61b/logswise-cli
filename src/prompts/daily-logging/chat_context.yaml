name: "Chat Context Templates"
description: "Templates for chat interactions with user context"
version: "1.0"
category: "daily-logging"
type: "context_templates"

templates:
  basic_chat:
    name: "Basic Chat Context"
    description: "Simple chat context with user profile"
    template: |
      User Info:
      - Profession: {{profession}}
      - Job Title: {{job_title}}
      - Company Name: {{company_name}}
      - Company Size: {{company_size}}
      
      {{notes_context}}
      
      User: {{user_message}}
      Assistant:

  enhanced_chat:
    name: "Enhanced Chat Context"
    description: "Rich chat context with full profile and project context"
    template: |
      === USER PROFILE ===
      Professional Identity:
      - Role: {{profession}} | Title: {{job_title}}
      - Company: {{company_name}} ({{company_size}} employees)
      - Experience: {{experience_level}} | Domain: {{domain}}
      
      Work Context:
      - Current Projects: {{current_projects}}
      - Tech Stack: {{tech_stack}}
      - Focus Areas: {{focus_areas}}
      
      === CONVERSATION CONTEXT ===
      {{notes_context}}
      
      === CONVERSATION ===
      User: {{user_message}}
      Assistant:

  quick_chat:
    name: "Quick Chat Context"
    description: "Minimal context for quick interactions"
    template: |
      Context: {{profession}} at {{company_name}}
      
      {{notes_context}}
      
      User: {{user_message}}
      Assistant:

variables:
  - name: "profession"
    description: "User's profession"
    type: "string"
    required: true
  - name: "job_title"
    description: "User's job title"
    type: "string"
    required: false
  - name: "company_name"
    description: "User's company name"
    type: "string"
    required: false
  - name: "company_size"
    description: "User's company size"
    type: "string"
    required: false
  - name: "experience_level"
    description: "User's experience level"
    type: "string"
    required: false
  - name: "domain"
    description: "User's domain expertise"
    type: "string"
    required: false
  - name: "current_projects"
    description: "User's current projects"
    type: "string"
    required: false
  - name: "tech_stack"
    description: "User's technology stack"
    type: "string"
    required: false
  - name: "focus_areas"
    description: "User's focus areas"
    type: "string"
    required: false
  - name: "notes_context"
    description: "Relevant notes context"
    type: "string"
    required: false
  - name: "user_message"
    description: "User's chat message"
    type: "string"
    required: true