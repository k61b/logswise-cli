name: "User Context Templates"
description: "Common user context templates used across different prompt types"
version: "1.0"
category: "common"
type: "context_templates"

templates:
  basic_user_info:
    name: "Basic User Information"
    description: "Standard user profile context"
    template: |
      User Info:
      - Profession: {{profession}}
      - Job Title: {{job_title}}
      - Company Name: {{company_name}}
      - Company Size: {{company_size}}

  professional_identity:
    name: "Professional Identity"
    description: "Comprehensive professional context"
    template: |
      🎯 PROFESSIONAL IDENTITY:
      Role: {{profession}} | Experience Level: {{experience_level}} | Domain: {{domain}}
      Organization: {{company_name}} ({{company_size}} employees) | Work Style: {{work_style}}
      Tech Stack: {{tech_stack}} | Career Stage: Aiming to {{career_goals}}

  cognitive_preferences:
    name: "Cognitive Preferences"
    description: "User's cognitive and learning preferences"
    template: |
      💡 COGNITIVE PREFERENCES:
      Communication: {{communication_style}} | Learning: {{learning_preference}} (complexity: {{complexity_level}})
      Decision Making: {{decision_making_style}} feedback loops | Active Times: {{active_times}}
      Learning Velocity: {{learning_velocity}} | Focus Areas: {{focus_areas}}

  minimal_context:
    name: "Minimal Context"
    description: "Minimal user context for quick interactions"
    template: |
      Context: {{profession}} at {{company_name}}

variables:
  - name: "profession"
    description: "User's profession"
    type: "string"
    required: true
  - name: "job_title"
    description: "User's job title"
    type: "string"
    required: false
  - name: "company_name"
    description: "User's company name"
    type: "string"
    required: false
  - name: "company_size"
    description: "User's company size"
    type: "string"
    required: false
  - name: "experience_level"
    description: "User's experience level"
    type: "string"
    required: false
  - name: "domain"
    description: "User's domain expertise"
    type: "string"
    required: false
  - name: "work_style"
    description: "User's work style preference"
    type: "string"
    required: false
  - name: "tech_stack"
    description: "User's technology stack"
    type: "string"
    required: false
  - name: "career_goals"
    description: "User's career objectives"
    type: "string"
    required: false
  - name: "communication_style"
    description: "User's communication preference"
    type: "string"
    required: false
  - name: "learning_preference"
    description: "User's learning style"
    type: "string"
    required: false
  - name: "complexity_level"
    description: "User's complexity preference"
    type: "string"
    required: false
  - name: "decision_making_style"
    description: "User's decision making approach"
    type: "string"
    required: false
  - name: "active_times"
    description: "User's active working hours"
    type: "string"
    required: false
  - name: "learning_velocity"
    description: "User's learning speed preference"
    type: "string"
    required: false
  - name: "focus_areas"
    description: "User's focus areas"
    type: "string"
    required: false